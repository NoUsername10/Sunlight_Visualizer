name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check && npm run build:sync
        working-directory: frontend
        env:
          SV_EXPECT_BAKED_NIGHT_LIGHTING: "1"
      - name: Verify daylight render color parity
        run: npm run check:webgl
        working-directory: frontend
        env:
          SV_EXPECT_BAKED_NIGHT_LIGHTING: "0"
      - name: Verify committed bundles match source
        run: git diff --exit-code -- dist/sunlight-visualizer-card.js custom_components/sunlight_visualizer/www/sunlight-visualizer-card.js
      - name: Package integration
        run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: sunlight-visualizer-release
          path: release-artifacts/

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: ['2026.1.0', 'stable']
    steps:
      - uses: actions/checkout@v4
      - name: Test against Home Assistant
        run: >-
          docker run --rm --pull=always
          -e PYTHONDONTWRITEBYTECODE=1
          -v "$PWD:/app" -w /app
          ghcr.io/home-assistant/home-assistant:${{ matrix.ha }}
          sh -c 'python -c "from homeassistant.const import __version__; print(__version__)" && python -m unittest discover -s tests -v'
